# --- hooks determinísticos -------------------------------------------------
# Um hook é um comando que roda na máquina de quem usa o FPCH. Por isso o
# DEFAULT EMBUTIDO do código não declara nenhum: uma política padrão que já
# viesse com comandos prontos transformaria a mera instalação da ferramenta em
# execução de código não pedida. Declarar hook é ato explícito do operador, no
# arquivo dele — que é exatamente o que este arquivo é.
#
# O hook abaixo é a Camada 4 (Determinística) do TCC em sua menor forma útil:
# um sensor que não pede juízo a nenhum modelo. O veredito dele vai para a
# trilha como evento `verify`, com `component`, `verdict` e `evidence`, e é daí
# que sai o dado auditável que o texto precisa citar.

[[hooks]]
nome = "pytest"
cmd = ["uv", "run", "--with", "pytest", "pytest", "-q"]
quando = "sempre"
criterio = "exit_zero"

# ---------------------------------------------------------------------------
# O QUE NÃO ESTÁ AQUI, E POR QUÊ
#
# Cinco blocos são deliberadamente NÃO-externalizáveis — não existe uma
# tabela TOML para eles, em nenhum nível da cascata, porque cada um É a
# própria defesa contra o conteúdo hostil que a canibalização assume como
# premissa (cannibalize.py:17-27). Um arquivo gravável entregaria essa defesa
# a um agente que corre com permissão de escrita — o anti-padrão que o TCC
# condena ao citar Rashidi.
#
#   1. Taxonomia de causa raiz      — audit.py::CAUSE_TAXONOMY (mecanismo cuja
#                                      edição mudaria o significado da trilha)
#   2. Regras de proveniência       — cannibalize.py:173-205
#   3. Cláusula anti-injeção        — cannibalize.py:208-247
#   4. Padrões de contenção         — backends.py:128-129
#   5. Portão de aprovação humana   — cli.py:213-219 (cannibalize.run() ainda
#                                      não confere target.status; ver Onda 2C)
#
# Ver `IMMUTABLE_BLOCKS` em `src/fpch/policy.py` para a razão de cada um por
# extenso, e `fpch config --dump` (Onda 2A) para vê-los listados como
# imutáveis ao lado da política que de fato é configurável.
# ---------------------------------------------------------------------------
