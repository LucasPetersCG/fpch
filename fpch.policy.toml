# fpch.policy.toml — arquivo de política de referência do FPCH
#
# Lido por `src/fpch/policy.py` (função `load()`). Este arquivo fica no
# diretório de trabalho do repositório, então ocupa o 3º nível da cascata de
# precedência (perde para `--policy` e para `FPCH_POLICY`; vence
# `~/.fpch/policy.toml` e o default embutido no código).
#
# Precedência completa, da maior para a menor:
#   1. --policy <caminho>            (linha de comando)
#   2. variável de ambiente FPCH_POLICY
#   3. ./fpch.policy.toml            (este arquivo)
#   4. ~/.fpch/policy.toml
#   5. default embutido em src/fpch/policy.py
#
# Os valores abaixo REPRODUZEM o default embutido — carregar este arquivo não
# muda nenhum comportamento hoje. Ele existe para servir de modelo: quem
# quiser divergir edita um bloco aqui e o resto continua herdando o default.
# Um bloco pode ser omitido inteiramente — o loader usa o default embutido
# para qualquer bloco ausente e registra a origem em `fpch config --dump`.
#
# Arquivo malformado, com chave desconhecida, ou com valor de tipo errado FALHA
# ALTO E CEDO — nunca degrada em silêncio. Ver o docstring de `policy.py`.

[meta]
versao = 1

[escalada]
# Quantos backends a mais tentar depois do preferido, antes de desistir.
max_escalations = 2
# Critério de ordenação dentro de uma classe de tarefa: mais barato primeiro;
# empate de custo desfeito por potência decrescente (o "-" inverte o sentido).
ordenar_por = ["cost", "-power"]

[backends]
# Segundos antes de abortar a chamada ao backend.
timeout_s = 600
# Acima disto (em caracteres) o prompt vai para arquivo em vez de argumento de
# linha de comando — o Windows corta CreateProcess em 32767 chars; ver
# `backends.py::_stage_prompt`.
arg_limit = 24000

[verificacao]
# Segundos antes de interromper cada hook determinístico de `fpch check`.
timeout_s = 120

[falha]
# Resposta mais curta que isto (em caracteres) é tratada como recusa ou
# saudação, não como trabalho de fato feito.
min_chars = 40
# Frases que os CLIs de terceiro emitem MESMO COM exit code 0. `exit == 0` não
# é contrato de sucesso nestes CLIs — ver o comentário longo em backends.py.
assinaturas = [
    "no output produced",
    "auto-denied",
    "headless mode cannot prompt",
    "permission that headless",
    "ineligibletiererror",
    "client no longer supported",
    "quota exceeded",
    "rate limit exceeded",
]

