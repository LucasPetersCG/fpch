[project]
name = "fpch"
version = "0.1.0"
description = "Personal Harness Constructor Framework — roteador multi-modelo e canibalizador de artefatos"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
fpch = "fpch.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fpch"]
